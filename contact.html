  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>

      <a href="index.html">Home</a>

  <main id="main-content">
    <h2>Contact information</h2>
    <p>Lets see what you need</p>
    <form action="https://formspree.io/f/your-form-id" method="post">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>
    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone">
    <label for="knife-orders">Basic Knife</label>
    <input type="radio" id="Basic-knife" name="basic-knife" value="basic" checked>
    <label for="custom-knife">Customer ordered knife</label>
    <input type="radio" id="custom-knife" name="custom-knife" value="custom">
    <label for="problem">Problem or issue</label>
    <input type="radio" id="problem" name="problem" value="problem">
    <label for="message">Tells us about the kind of knife you want here, for example, what kind of blade style you want or if you want a wooden handel, etc. You can also tell here if you had a problem</label>
    <textarea id="message" name="message" required></textarea>
    <button type="submit">Send Booking Request</button>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Sturdevant Smithy</p>
  </footer>

</body>
