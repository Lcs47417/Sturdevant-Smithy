<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - Sturdvant Smithy.</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <a href="#main-contact" class="skip-link">Skip to main content</a>
<div id="container">
  <header>
    <h1>Sturdevant Smithy</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="work.html">Our Work</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>
 <div id="form-container">
  <main id="main-contact" tabindex="-1">
    <h2>Contact information</h2>
    <p>Lets see what you need</p>
    <form action="https://formspree.io/f/your-form-id" method="post">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>
    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    <label for="knife-orders">Basic Knife</label>
    <input type="radio" id="Basic-knife" name="option" value="basic" checked>
    <label for="custom-knife">Customer ordered knife</label>
    <input type="radio" id="custom-knife" name="option" value="custom">
    <label for="problem">Problem or issue</label>
    <input type="radio" id="problem" name="option" value="problem">
    <label for="message">Tells us about the kind of knife you want here, for example, what kind of blade style you want or if you want a wooden handel, etc. You can also tell here if you had a problem</label>
    <textarea id="message" name="message" required></textarea>
    <button type="submit">Send order</button> 
  </form>
    <button id="location-button" onclick="getLocation()">See How Close You Are</button>
    <p id="location-message"></p>
  </main>
 </div>
  <footer>
    <p>&copy; 2026 Sturdevant Smithy</p>
  </footer>
</div>
<script>
  function getLocation() {
    navigator.geolocation.getCurrentPosition(showPosition, showError);
  }

  function showPosition(position) {
    var lat = position.coords.latitude.toFixed(1);
    var lon = position.coords.longitude.toFixed(1);
    document.getElementById("location-message").textContent =
      "You're near " + lat + ", " + lon + ". The Sturdevant smithy is located in the central virginian area. This may affect shipping times and costs.";
  }

  function showError(error) {
    document.getElementById("location-message").textContent =
      "We couldn't get your location, but that's alright. You can still browse the rest of the site.";
  }
</script>
</body>
</html>
